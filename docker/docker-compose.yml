# Monitoring stack (design section 3). Ollama and the Python agent run natively on Windows.
# Ports are bound to localhost only (design section 12).
services:
  wiretap:
    build:
      context: ./wiretap
      dockerfile: Dockerfile
    container_name: wiretap
    restart: unless-stopped
    command:
      - python
      - /app/companion/wiretap_bridge.py
      - --file
      - /factorio/script-output/wiretap/stats.json
    volumes:
      - "${FACTORIO_SCRIPT_OUTPUT:-./factorio-script-output}:/factorio/script-output:ro"
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - wiretap
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
