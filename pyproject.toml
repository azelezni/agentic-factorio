[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorio-agent"
version = "0.1.0"
description = "Local, read-only AI observability agent for Factorio (Prometheus + Ollama)"
requires-python = ">=3.10"
dependencies = []   # stdlib only; TOML config needs Python 3.11+

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
factorio-agent = "factorio_agent.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
